name: Build and Release

on:
  release:
    types: [ released, prereleased ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      # git archive leaves out everything marked export-ignore in .gitattributes.
      - name: Copy the plugin files
        run: |
          mkdir -p build/llms-helper
          git archive HEAD | tar -x -C build/llms-helper

      - name: Install production dependencies
        working-directory: build/llms-helper
        run: composer update --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Zip
        working-directory: build
        run: zip -r ../llms-helper.zip llms-helper

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: llms-helper.zip
