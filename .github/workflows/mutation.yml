name: Mutation

on:
  workflow_dispatch:

jobs:
  infection:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 'crab'
          MYSQL_DATABASE: llms_helper_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pcrab"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli
          coverage: pcov

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run Infection, one thread
        env:
          environment_github: true
        run: composer mutation -- --threads=1 --no-progress

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infection-reports
          path: tests/.cache/infection/
          retention-days: 14
